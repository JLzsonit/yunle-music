name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub ubuntu 运行器已预装 Android SDK（ANDROID_HOME），无需额外安装

      - name: Prepare Capacitor project
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 --no-audit --no-fund
          # 完整界面内置进 APK：本地加载 UI，联网时调用云端引擎下载
          rm -rf www && mkdir -p www
          cp -r static/* www/
          rm -f www/sw.js
          # 壳内本地路径兜底：/static/default-cover.svg 也要可访问
          mkdir -p www/static && cp static/default-cover.svg www/static/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.jlzsonit.yunle",
            "appName": "云乐",
            "webDir": "www",
            "android": { "allowMixedContent": false }
          }
          EOF
          npx cap add android
          npx cap sync android

      # 固定签名 + 版本号自动递增：
      #   1) 仓库内的 debug.keystore 保证每次构建签名一致 → 可直接覆盖安装升级，无需卸载重装
      #   2) versionCode = run number（单调递增），versionName = 1.2.<run_number>
      - name: Stable signature & auto version bump
        run: |
          cp keystore/debug.keystore android/app/debug.keystore
          python3 - <<'EOF'
          import re
          p = "android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          n = "${{ github.run_number }}"
          s = re.sub(r"versionCode \d+", f"versionCode {n}", s)
          s = re.sub(r'versionName "[^"]*"', f'versionName "1.2.{n}"', s)
          s += """

          android {
              signingConfigs {
                  stable {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.stable
                  }
              }
          }
          """
          open(p, "w", encoding="utf-8").write(s)
          print("versionCode/versionName/signingConfig applied")
          EOF
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Replace launcher icon
        run: |
          python3 - <<'EOF'
          import urllib.request, struct, zlib, os
          url = "https://yunle-music.app.workbuddy.host/icons/icon-512.png?sharecode=YBAGATMDBV"
          src = "/tmp/icon512.png"
          urllib.request.urlretrieve(url, src)
          # 用纯 Python 解码 PNG 并缩放（ runner 自带 python3 但可能无 PIL）
          try:
              from PIL import Image
              have_pil = True
          except ImportError:
              have_pil = False
          dens = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          base = "android/app/src/main/res"
          if have_pil:
              img = Image.open(src)
              for d, s in dens.items():
                  out = os.path.join(base, f"mipmap-{d}")
                  os.makedirs(out, exist_ok=True)
                  img.resize((s, s), Image.LANCZOS).save(os.path.join(out, "ic_launcher.png"))
                  img.resize((s, s), Image.LANCZOS).save(os.path.join(out, "ic_launcher_round.png"))
              print("icon replaced with PIL")
          else:
              import shutil
              for d in dens:
                  out = os.path.join(base, f"mipmap-{d}")
                  os.makedirs(out, exist_ok=True)
                  shutil.copy(src, os.path.join(out, "ic_launcher.png"))
                  shutil.copy(src, os.path.join(out, "ic_launcher_round.png"))
              print("icon copied without resize")
          EOF

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename artifact
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/云乐-yunle-v1.2.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yunle-android-apk
          path: output/云乐-yunle-v1.2.${{ github.run_number }}.apk
