name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios/Yunle && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios/Yunle
          xcodebuild -project Yunle.xcodeproj -scheme Yunle \
            -configuration Release -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES -quiet

      - name: Package IPA
        run: |
          mkdir -p Payload output
          cp -R ios/Yunle/build/Build/Products/Release-iphoneos/Yunle.app Payload/
          zip -rq "output/云乐-yunle-ios-v1.0.0-unsigned.ipa" Payload
          rm -rf Payload
          ls -la output/

      - uses: actions/upload-artifact@v4
        with:
          name: yunle-ios-ipa
          path: output/云乐-yunle-ios-v1.0.0-unsigned.ipa
